name: Publish

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install dependencies
        run: bun install
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: Verify tag matches package version
        run: |
          pkg_version=$(node -p "require('./package.json').version")
          if [ "${{ github.event.release.tag_name }}" != "v${pkg_version}" ]; then
            echo "::error::Tag ${{ github.event.release.tag_name }} does not match package version ${pkg_version}"
            exit 1
          fi
          echo "Publishing ${pkg_version}"
      - name: Test
        run: bun test
      - name: Publish
        run: npm stage publish --access public
