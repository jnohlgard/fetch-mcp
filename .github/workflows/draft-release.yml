name: Draft Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check whether a release for this version exists
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v${version}"
          if [ -n "$(git ls-remote --tags origin "$tag")" ]; then
            echo "Tag ${tag} already exists; skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if gh api /repos/${GITHUB_REPOSITORY}/releases --jq '.[].tag_name' | grep -Fxq "$tag"; then
            echo "Release ${tag} already exists; skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Create draft release
        if: steps.existing.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v${version}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "$tag"
          git push origin "$tag"
          gh release create "$tag" --draft --target "${GITHUB_SHA}" --generate-notes
          echo "Draft release ${tag} created; publish it from the GitHub UI"
